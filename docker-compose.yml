services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: qcm-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
      - ./config:/app/config
    environment:
      - PYTHONUNBUFFERED=1
      - API_ENV=production
    networks:
      - qcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qcm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - qcm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  qcm-network:
    driver: bridge

volumes:
  data:
  exports:

